<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator">
        <!-- <h1>Smart Calculator</h1> -->

        <section class="display">
            <div id="previous"></div>
            <output id="display" aria-live="polite">0</output>
        </section>

        <section class="keys" aria-label="Calculator Keyboard">
            <!--For Row 1-->
            <button type="button" data-action="clear">AC</button>
            <button type="button" data-action="delete">DEL</button>
            <button type="button" data-action="percent">%</button>
            <button type="button" data-operator="/">÷</button>

            <!--For Row 2-->
            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" data-operator="*">x</button>

            <!--For Row 3-->
            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" data-operator="-">-</button>

            <!--For Row 4-->
            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" data-operator="+">+</button>

            <!--For Row 5-->
            <button type="button" data-action="sign" ">+-</button>
            <button type="button" data-number="0">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" data-action="calculate">=</button>

            <script src="script.js"></script>
        </section>
    </main>
</body>
</html>
